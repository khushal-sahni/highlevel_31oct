services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: opportunities
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d opportunities"]
      interval: 2s
      timeout: 5s
      retries: 20

  api:
    build: .
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgres://app:app@postgres:5432/opportunities
      PORT: 3000
    depends_on:
      postgres:
        condition: service_healthy

  worker:
    build: .
    command: ["sh", "-c", "node dist/db/migrate.js && node dist/worker.js"]
    environment:
      DATABASE_URL: postgres://app:app@postgres:5432/opportunities
      DATABASE_POOL_MAX: "1"
      MAX_IN_FLIGHT_CHUNKS: "4"
    deploy:
      replicas: 4
    depends_on:
      postgres:
        condition: service_healthy
